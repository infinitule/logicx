<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1200" height="470" rx="16" fill="#0B0F14"/><text x="44" y="46" font-size="17" fill="#E6EDF3" text-anchor="start" font-weight="600">Five surfaces, narrowest first</text><text x="44" y="70" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">Each rung is used only for what the rung above cannot reach. Screenshots are the last resort, not the default.</text><rect x="44" y="108" width="216" height="200" rx="12" fill="#111820"/><rect x="44" y="108" width="216" height="200" rx="12" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="152.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Mackie Control</text><text x="152.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">faders · V-Pots · buttons</text><text x="152.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">LCD names + values · LEDs</text><text x="152.0" y="188" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">meters · playhead</text><text x="152.0" y="204" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">no focus, no window,</text><text x="152.0" y="220" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">works in the background</text><text x="152.0" y="336" font-size="26" fill="#3FB950" text-anchor="middle" font-weight="700" opacity="0.35">1</text><rect x="280" y="108" width="216" height="200" rx="12" fill="#111820"/><rect x="280" y="108" width="216" height="200" rx="12" fill="none" stroke="#58A6FF" stroke-width="1.25"/><text x="388.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Accessibility</text><text x="388.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">dB text · pan · mute/solo</text><text x="388.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">rec · monitor · automation</text><text x="388.0" y="188" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">output · format · peak</text><text x="388.0" y="204" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">needs Logic frontmost —</text><text x="388.0" y="220" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">costs a focus flicker</text><text x="388.0" y="336" font-size="26" fill="#58A6FF" text-anchor="middle" font-weight="700" opacity="0.35">2</text><rect x="516" y="108" width="216" height="200" rx="12" fill="#111820"/><rect x="516" y="108" width="216" height="200" rx="12" fill="none" stroke="#39C5CF" stroke-width="1.25"/><text x="624.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">Menu tree</text><text x="624.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">every command the app has,</text><text x="624.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">discovered from the</text><text x="624.0" y="188" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">running app itself</text><text x="624.0" y="204" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">invoked by name,</text><text x="624.0" y="220" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">never by coordinate</text><text x="624.0" y="336" font-size="26" fill="#39C5CF" text-anchor="middle" font-weight="700" opacity="0.35">3</text><rect x="752" y="108" width="216" height="200" rx="12" fill="#111820"/><rect x="752" y="108" width="216" height="200" rx="12" fill="none" stroke="#BC8CFF" stroke-width="1.25"/><text x="860.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">OSC (Renderer)</text><text x="860.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">transport · monitoring</text><text x="860.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">dim · mute · layout</text><text x="860.0" y="188" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">13 documented addresses</text><text x="860.0" y="204" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">fire-and-forget:</text><text x="860.0" y="220" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">confirm elsewhere</text><text x="860.0" y="336" font-size="26" fill="#BC8CFF" text-anchor="middle" font-weight="700" opacity="0.35">4</text><rect x="988" y="108" width="216" height="200" rx="12" fill="#111820"/><rect x="988" y="108" width="216" height="200" rx="12" fill="none" stroke="#FF7B72" stroke-width="1.25"/><text x="1096.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">computer-use</text><text x="1096.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">third-party plug-in windows</text><text x="1096.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">anything the four above</text><text x="1096.0" y="188" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">cannot reach</text><text x="1096.0" y="204" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">screenshot to read —</text><text x="1096.0" y="220" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">and say that you did</text><text x="1096.0" y="336" font-size="26" fill="#FF7B72" text-anchor="middle" font-weight="700" opacity="0.35">5</text><rect x="44" y="360" width="1112" height="78" rx="12" fill="#0F1620"/><rect x="44" y="360" width="1112" height="78" rx="12" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="68" y="388" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="600">The rule that makes the ladder work</text><text x="68" y="412" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">A surface is only allowed if it can be read back. Every setter re-reads the control it moved and reports before → after;</text><text x="68" y="430" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">a change that cannot be verified is reported as a failure, never as success.</text></svg>