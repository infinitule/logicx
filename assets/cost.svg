<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1100" height="470" rx="16" fill="#0B0F14"/><text x="44" y="46" font-size="17" fill="#E6EDF3" text-anchor="start" font-weight="600">What it costs to know the state of the mix</text><text x="44" y="70" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">Context tokens for ONE read — screenshot by the documented w×h/750 formula, text by bytes/4.</text><text x="44" y="106" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="600">one screenshot (1680×1050)</text><rect x="44" y="116" width="640.0" height="30" rx="9" fill="#FF7B72" opacity="0.18"/><rect x="44" y="116" width="640.0" height="30" rx="9" fill="none"/><rect x="44" y="116" width="640.0" height="30" rx="9" fill="none" stroke="#FF7B72" stroke-width="1.25"/><text x="702" y="137" font-size="11.5" fill="#FF7B72" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">2,352 tok</text><text x="44" y="166" font-size="10.5" fill="#6E7A87" text-anchor="start" font-weight="400">shows only what is visible · no exact values · must be re-shot after every action</text><text x="44" y="198" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="600">logic.py mixer strips — 16 strips × 10 fields</text><rect x="44" y="208" width="138.77551020408163" height="30" rx="9" fill="#3FB950" opacity="0.18"/><rect x="44" y="208" width="138.77551020408163" height="30" rx="9" fill="none"/><rect x="44" y="208" width="138.77551020408163" height="30" rx="9" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="702" y="229" font-size="11.5" fill="#3FB950" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">510 tok</text><text x="44" y="258" font-size="10.5" fill="#6E7A87" text-anchor="start" font-weight="400">dB, pan, mute, solo, rec, monitor, automation mode, output, format, peak</text><text x="44" y="290" font-size="12.5" fill="#E6EDF3" text-anchor="start" font-weight="600">mcuctl status — the whole surface</text><rect x="44" y="300" width="32.10884353741497" height="30" rx="9" fill="#58A6FF" opacity="0.18"/><rect x="44" y="300" width="32.10884353741497" height="30" rx="9" fill="none"/><rect x="44" y="300" width="32.10884353741497" height="30" rx="9" fill="none" stroke="#58A6FF" stroke-width="1.25"/><text x="702" y="321" font-size="11.5" fill="#58A6FF" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">118 tok</text><text x="44" y="350" font-size="10.5" fill="#6E7A87" text-anchor="start" font-weight="400">transport + automation LEDs, assignment display, playhead, 8 track names</text><rect x="44" y="386" width="1012" height="74" rx="12" fill="#0F1620"/><rect x="44" y="386" width="1012" height="74" rx="12" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="68" y="414" font-size="12" fill="#E6EDF3" text-anchor="start" font-weight="600">The screenshot costs 4.6× the complete table — and carries less.</text><text x="68" y="438" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">It cannot show a strip scrolled off-screen, a dB value to one decimal, or a mute you did not think to look at.</text></svg>