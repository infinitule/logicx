<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1200" height="430" rx="16" fill="#0B0F14"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#6E7A87"/></marker><marker id="arR" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#FF7B72"/></marker><marker id="arG" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#3FB950"/></marker></defs><text x="44" y="52" font-size="19" fill="#E6EDF3" text-anchor="start" font-weight="600">Claude does not look at Logic Pro. Claude is a Mackie Control.</text><text x="44" y="78" font-size="12.5" fill="#8B949E" text-anchor="start" font-weight="400">Protocol-native app control: the agent speaks a machine interface the app already trusts.</text><rect x="44" y="108" width="520" height="286" rx="12" fill="#0F1620"/><rect x="44" y="108" width="520" height="286" rx="12" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="68" y="140" font-size="11.5" fill="#FF7B72" text-anchor="start" font-weight="600">THE SCREENSHOT LOOP</text><text x="68" y="162" font-size="11.5" fill="#6E7A87" text-anchor="start" font-weight="400">drive a UI built for human eyes</text><rect x="68" y="190" width="472" height="28" rx="8" fill="#111820"/><rect x="68" y="190" width="472" height="28" rx="8" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="84" y="209" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">screenshot  ~2,352 tokens</text><line x1="304" y1="218" x2="304" y2="228" stroke="#FF7B72" stroke-width="1.5" marker-end="url(#arR)"/><rect x="68" y="228" width="472" height="28" rx="8" fill="#111820"/><rect x="68" y="228" width="472" height="28" rx="8" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="84" y="247" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">find the fader by pixel</text><line x1="304" y1="256" x2="304" y2="266" stroke="#FF7B72" stroke-width="1.5" marker-end="url(#arR)"/><rect x="68" y="266" width="472" height="28" rx="8" fill="#111820"/><rect x="68" y="266" width="472" height="28" rx="8" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="84" y="285" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">click / drag  (hope)</text><line x1="304" y1="294" x2="304" y2="304" stroke="#FF7B72" stroke-width="1.5" marker-end="url(#arR)"/><rect x="68" y="304" width="472" height="28" rx="8" fill="#111820"/><rect x="68" y="304" width="472" height="28" rx="8" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="84" y="323" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">screenshot again to check</text><line x1="304" y1="332" x2="304" y2="342" stroke="#FF7B72" stroke-width="1.5" marker-end="url(#arR)"/><rect x="68" y="342" width="472" height="28" rx="8" fill="#111820"/><rect x="68" y="342" width="472" height="28" rx="8" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="84" y="361" font-size="11.5" fill="#FF7B72" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">still no exact dB value</text><rect x="600" y="108" width="556" height="286" rx="12" fill="#0F1620"/><rect x="600" y="108" width="556" height="286" rx="12" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="624" y="140" font-size="11.5" fill="#3FB950" text-anchor="start" font-weight="600">THE PROTOCOL LOOP</text><text x="624" y="162" font-size="11.5" fill="#6E7A87" text-anchor="start" font-weight="400">speak what the app already listens for</text><rect x="624" y="190" width="196" height="84" rx="10" fill="#111820"/><rect x="624" y="190" width="196" height="84" rx="10" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="722" y="218" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="600">Claude</text><text x="722" y="240" font-size="10.5" fill="#8B949E" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">mcu/daemon.py</text><text x="722" y="258" font-size="10.5" fill="#6E7A87" text-anchor="middle" font-weight="400">virtual CoreMIDI port</text><rect x="960" y="190" width="172" height="84" rx="10" fill="#111820"/><rect x="960" y="190" width="172" height="84" rx="10" fill="none" stroke="#58A6FF" stroke-width="1.25"/><text x="1046" y="218" font-size="14" fill="#E6EDF3" text-anchor="middle" font-weight="600">Logic Pro</text><text x="1046" y="240" font-size="10.5" fill="#8B949E" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">12.3.1</text><text x="1046" y="258" font-size="10.5" fill="#6E7A87" text-anchor="middle" font-weight="400">adopts it itself</text><text x="890" y="214" font-size="9.5" fill="#6E7A87" text-anchor="middle" font-weight="400">faders · V-Pots · buttons</text><line x1="826" y1="224" x2="954" y2="224" stroke="#3FB950" stroke-width="1.5" marker-end="url(#arG)"/><text x="890" y="250" font-size="9.5" fill="#6E7A87" text-anchor="middle" font-weight="400">names · dB · LEDs · meters</text><line x1="954" y1="260" x2="826" y2="260" stroke="#58A6FF" stroke-width="1.5" marker-end="url(#ar)"/><rect x="624" y="296" width="508" height="76" rx="10" fill="#111820"/><rect x="624" y="296" width="508" height="76" rx="10" fill="none" stroke="#1E2A38" stroke-width="1.25"/><text x="648" y="322" font-size="12" fill="#E6EDF3" text-anchor="start" font-weight="600">every change is reported from Logic's echo,</text><text x="648" y="344" font-size="12" fill="#3FB950" text-anchor="start" font-weight="600">never from the command that was sent.</text><text x="648" y="362" font-size="10.5" fill="#6E7A87" text-anchor="start" font-weight="400">a fader move that did not land looks exactly like one that did</text></svg>