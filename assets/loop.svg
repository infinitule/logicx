<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="1160" height="400" rx="16" fill="#0B0F14"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="2.8" orient="auto"><path d="M0,0 L0,5.6 L7,2.8 z" fill="#6E7A87"/></marker></defs><text x="44" y="46" font-size="17" fill="#E6EDF3" text-anchor="start" font-weight="600">Closed-loop control: the app's own display is the sensor</text><text x="44" y="70" font-size="11.5" fill="#8B949E" text-anchor="start" font-weight="400">Logic's fader is not settable. `set value` nudges ±1 unit (≈0.1 dB), AXIncrement steps ±10 (≈1 dB), and the dB lives in the element's NAME.</text><rect x="44" y="108" width="240" height="110" rx="12" fill="#111820"/><rect x="44" y="108" width="240" height="110" rx="12" fill="none" stroke="#58A6FF" stroke-width="1.25"/><text x="164.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">read</text><text x="164.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">parse the dB text</text><text x="164.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">that Logic renders</text><line x1="284" y1="163" x2="312" y2="163" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="312" y="108" width="240" height="110" rx="12" fill="#111820"/><rect x="312" y="108" width="240" height="110" rx="12" fill="none" stroke="#39C5CF" stroke-width="1.25"/><text x="432.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">decide</text><text x="432.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">|diff| ≥ 0.95 dB → step</text><text x="432.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">smaller → nudge</text><line x1="552" y1="163" x2="580" y2="163" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="580" y="108" width="240" height="110" rx="12" fill="#111820"/><rect x="580" y="108" width="240" height="110" rx="12" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="700.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">act</text><text x="700.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">one AX action, or</text><text x="700.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">one MIDI message</text><line x1="820" y1="163" x2="848" y2="163" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><rect x="848" y="108" width="240" height="110" rx="12" fill="#111820"/><rect x="848" y="108" width="240" height="110" rx="12" fill="none" stroke="#D29922" stroke-width="1.25"/><text x="968.0" y="135" font-size="14.5" fill="#E6EDF3" text-anchor="middle" font-weight="600">re-read</text><text x="968.0" y="156" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">did the value move?</text><text x="968.0" y="172" font-size="11" fill="#8B949E" text-anchor="middle" font-weight="400">stale twice → abort</text><line x1="1092" y1="218" x2="1092" y2="248" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><line x1="1092" y1="248" x2="168" y2="248" stroke="#6E7A87" stroke-width="1.5" marker-end="url(#ar)"/><text x="600" y="240" font-size="11" fill="#6E7A87" text-anchor="middle" font-weight="400">loop until |target − current| ≤ 0.05 dB, or 120 steps, or the readout stops moving</text><rect x="44" y="276" width="1072" height="96" rx="12" fill="#0F1620"/><rect x="44" y="276" width="1072" height="96" rx="12" fill="none" stroke="#3FB950" stroke-width="1.25"/><text x="68" y="304" font-size="12" fill="#E6EDF3" text-anchor="start" font-weight="600">Real output, copied from a run</text><text x="68" y="330" font-size="11.5" fill="#3FB950" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Audio 1 volume: -6.0 dB -&gt; 0.0 dB  (target 0.0, 6 steps, raw 173, 5.25s)</text><text x="68" y="354" font-size="11.5" fill="#3FB950" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">fader 2: sent 9913 (-6.0 dB); host fader 12443 -&gt; 9874 (-6.1 dB), LCD '-6.0 dB'</text></svg>