[project]
name = "logicx"
version = "1.0.0"
description = "Protocol-native control surface for Logic Pro over Mackie Control Universal"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chandandeep Sharma" }]
dependencies = ["python-rtmidi"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["kit/mcu/tests"]
pythonpath = ["kit"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Keep lint advisory on this research codebase; CI fails only on syntax/undefined names.
select = ["E9", "F63", "F7", "F82"]
